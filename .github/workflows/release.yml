name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a release"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_FILE: "EarthTool.sln"

jobs:
  build-and-test:
    name: Build ${{ matrix.project }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        project: [cli, wd-gui, par-gui, tex-gui]
        include:
          # CLI configurations
          - project: cli
            project_path: "EarthTool.CLI/EarthTool.CLI.csproj"
            artifact_prefix: "EarthTool.CLI"
          # WD GUI configurations
          - project: wd-gui
            project_path: "EarthTool.WD.GUI/EarthTool.WD.GUI.csproj"
            artifact_prefix: "EarthTool.WD.GUI"
          # PAR GUI configurations
          - project: par-gui
            project_path: "EarthTool.PAR.GUI/EarthTool.PAR.GUI.csproj"
            artifact_prefix: "EarthTool.PAR.GUI"
          # TEX GUI configurations
          - project: tex-gui
            project_path: "EarthTool.TEX.GUI/EarthTool.TEX.GUI.csproj"
            artifact_prefix: "EarthTool.TEX.GUI"
          # Platform configurations
          - os: windows-latest
            runtime: win-x64
            platform_name: Windows-x64
          - os: ubuntu-latest
            runtime: linux-x64
            platform_name: Linux-x64

    steps:
      - name: Display build context
        shell: bash
        run: |
          echo "🚀 Building ${{ matrix.artifact_prefix }} for Release"
          echo "Platform: ${{ matrix.os }}"
          echo "Runtime: ${{ matrix.runtime }}"
          echo "Project: ${{ matrix.project }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Display version information
        shell: bash
        run: |
          echo "📦 Release Version Information:"
          echo "  SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "  AssemblySemVer: ${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "  InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          echo "  Major.Minor.Patch: ${{ steps.gitversion.outputs.majorMinorPatch }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test-tools/package-lock.json

      - name: Install pinned Khronos validator
        run: npm ci --prefix test-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore -p:Version=${{ steps.gitversion.outputs.semVer }} -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal --filter "Category!=BlenderQualification" --logger "trx;LogFileName=test-results-${{ matrix.runtime }}.trx"
        continue-on-error: false
        env:
          EARTHTOOL_RUN_KHRONOS_VALIDATOR: "1"

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Test Results (${{ matrix.project }} - ${{ matrix.os }})
          path: "**/*.trx"
          reporter: dotnet-trx
          fail-on-error: false

      - name: Publish application
        shell: bash
        run: |
          dotnet publish ${{ matrix.project_path }} \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish/${{ matrix.runtime }} \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:Version=${{ steps.gitversion.outputs.semVer }} \
            -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
            -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Verify published MSH command tree
        if: matrix.project == 'cli'
        shell: bash
        run: |
          CLI="./publish/${{ matrix.runtime }}/EarthTool.CLI"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then CLI="${CLI}.exe"; fi
          EARTHTOOL_CLI_EXECUTABLE="$CLI" dotnet test \
            EarthTool.CLI.Tests/EarthTool.CLI.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName=EarthTool.CLI.Tests.PublicCutoverAcceptanceTests.CliProcessExposesOnlyTheGltfMshCommandTreeAndStableExitStatuses"

      - name: Create artifact archive
        shell: bash
        run: |
          cd "publish/${{ matrix.runtime }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip "../../${{ matrix.artifact_prefix }}-${{ matrix.platform_name }}.zip" *
          else
            tar -czf "../../${{ matrix.artifact_prefix }}-${{ matrix.platform_name }}.tar.gz" *
          fi
          cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_prefix }}-${{ matrix.platform_name }}
          path: ${{ matrix.artifact_prefix }}-${{ matrix.platform_name }}${{ matrix.os == 'windows-latest' && '.zip' || '.tar.gz' }}
          retention-days: 30

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ubuntu-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ubuntu-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Install dotnet format
        run: dotnet tool install -g dotnet-format || dotnet tool update -g dotnet-format

      - name: Check code formatting
        id: format-check
        run: |
          echo "## Code Formatting Report" > code-quality-report.md
          echo "" >> code-quality-report.md
          
          if dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --verbosity diagnostic 2>&1 | tee format-output.txt; then
            echo "✅ **Status**: All files are properly formatted" >> code-quality-report.md
            echo "format_status=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ **Status**: Formatting issues found" >> code-quality-report.md
            echo "" >> code-quality-report.md
            echo "### Issues Found:" >> code-quality-report.md
            echo "\`\`\`" >> code-quality-report.md
            tail -20 format-output.txt >> code-quality-report.md
            echo "\`\`\`" >> code-quality-report.md
            echo "format_status=failed" >> $GITHUB_OUTPUT
          fi
          
          echo "" >> code-quality-report.md
        continue-on-error: true

      - name: Run code analysis with warnings
        id: code-analysis
        run: |
          echo "## Code Analysis Report" >> code-quality-report.md
          echo "" >> code-quality-report.md
          
          # Run build and capture output
          set +e
          dotnet build ${{ env.SOLUTION_FILE }} \
            --configuration Release \
            --no-restore \
            /p:TreatWarningsAsErrors=false \
            /p:WarningLevel=4 2>&1 | tee analysis-output.txt
          BUILD_EXIT_CODE=$?
          set -e
          
          # Count warnings and errors
          WARNING_COUNT=$(grep "warning CS" analysis-output.txt 2>/dev/null | wc -l)
          ERROR_COUNT=$(grep "error CS" analysis-output.txt 2>/dev/null | wc -l)
          
          echo "### Build Statistics:" >> code-quality-report.md
          echo "- ⚠️ Warnings: $WARNING_COUNT" >> code-quality-report.md
          echo "- ❌ Errors: $ERROR_COUNT" >> code-quality-report.md
          echo "- 🔄 Exit Code: $BUILD_EXIT_CODE" >> code-quality-report.md
          echo "" >> code-quality-report.md
          
          if [ "$WARNING_COUNT" -gt 0 ] 2>/dev/null; then
            echo "### Warnings:" >> code-quality-report.md
            echo "\`\`\`" >> code-quality-report.md
            grep "warning CS" analysis-output.txt | head -20 >> code-quality-report.md
            echo "\`\`\`" >> code-quality-report.md
          fi
          
          echo "analysis_warnings=$WARNING_COUNT" >> $GITHUB_OUTPUT
          echo "analysis_errors=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo "build_exit_code=$BUILD_EXIT_CODE" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload code quality report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-quality-report
          path: |
            code-quality-report.md
            format-output.txt
            analysis-output.txt
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Install security scanning tools
        run: |
          dotnet tool install -g dotnet-outdated-tool || dotnet tool update -g dotnet-outdated-tool

      - name: Check for vulnerable packages
        id: vuln-check
        run: |
          echo "## 🔒 Security Scan Report" > security-report.md
          echo "" >> security-report.md
          echo "### Vulnerable Packages" >> security-report.md
          echo "" >> security-report.md
          
          set +e
          dotnet list ${{ env.SOLUTION_FILE }} package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          VULN_EXIT_CODE=$?
          set -e
          
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "⚠️ **Status**: Vulnerabilities found" >> security-report.md
            echo "" >> security-report.md
            echo "\`\`\`" >> security-report.md
            grep -A 10 "has the following vulnerable packages" vulnerable-packages.txt | head -50 >> security-report.md
            echo "\`\`\`" >> security-report.md
            echo "vuln_status=found" >> $GITHUB_OUTPUT
          else
            echo "✅ **Status**: No known vulnerabilities" >> security-report.md
            echo "vuln_status=clean" >> $GITHUB_OUTPUT
          fi
          echo "" >> security-report.md
        continue-on-error: true

      - name: Check for outdated packages
        id: outdated-check
        run: |
          echo "### Outdated Packages" >> security-report.md
          echo "" >> security-report.md
          
          set +e
          dotnet outdated ${{ env.SOLUTION_FILE }} 2>&1 | tee outdated-packages.txt
          OUTDATED_EXIT_CODE=$?
          set -e
          
          OUTDATED_COUNT=$(grep "Possible update" outdated-packages.txt 2>/dev/null | wc -l)
          
          if [ "$OUTDATED_COUNT" -gt 0 ] 2>/dev/null; then
            echo "📦 **Status**: $OUTDATED_COUNT outdated packages found" >> security-report.md
            echo "" >> security-report.md
            echo "\`\`\`" >> security-report.md
            grep "Possible update" outdated-packages.txt | head -20 >> security-report.md
            echo "\`\`\`" >> security-report.md
            echo "outdated_count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT
          else
            echo "✅ **Status**: All packages are up to date" >> security-report.md
            echo "outdated_count=0" >> $GITHUB_OUTPUT
          fi
          echo "" >> security-report.md
        continue-on-error: true

      - name: Upload security scan results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-scan-report
          path: |
            security-report.md
            vulnerable-packages.txt
            outdated-packages.txt
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-and-test, code-quality, security-scan]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Display release version
        shell: bash
        run: |
          echo "📦 Creating Release:"
          echo "  Version: ${{ steps.gitversion.outputs.semVer }}"
          echo "  Full SemVer: ${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="v${{ steps.gitversion.outputs.semVer }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          RANGE="HEAD"

          echo "## $CURRENT_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..HEAD"
            echo "Commits since [\`$PREVIOUS_TAG\`](https://github.com/${{ github.repository }}/releases/tag/$PREVIOUS_TAG):" >> CHANGELOG.md
          else
            echo "Commits included in this initial release:" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md

          append_commits() {
            local type="$1"
            local heading="$2"
            local pattern="^${type}(\\([^)]*\\))?!?:[[:space:]]"
            local commits

            commits=$(git log "$RANGE" --no-merges --format='%s%x09%an%x09%h%x09%H' |
              while IFS=$'\t' read -r subject author short_sha sha; do
                if [[ "$subject" =~ $pattern ]]; then
                  printf -- '- %s - %s ([`%s`](https://github.com/${{ github.repository }}/commit/%s))\n' \
                    "$subject" "$author" "$short_sha" "$sha"
                fi
              done)

            if [ -n "$commits" ]; then
              echo "### $heading" >> CHANGELOG.md
              echo "" >> CHANGELOG.md
              printf '%s\n\n' "$commits" >> CHANGELOG.md
            fi
          }

          append_commits "feat" "Features"
          append_commits "fix" "Fixes"

          echo "Generated release notes:"
          cat CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: EarthTool v${{ steps.gitversion.outputs.semVer }}
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.gitversion.outputs.semVer, 'alpha') || contains(steps.gitversion.outputs.semVer, 'beta') || contains(steps.gitversion.outputs.semVer, 'rc') }}
          generate_release_notes: false
          files: |
            artifacts/EarthTool.CLI-Windows-x64/EarthTool.CLI-Windows-x64.zip
            artifacts/EarthTool.CLI-Linux-x64/EarthTool.CLI-Linux-x64.tar.gz
            artifacts/EarthTool.WD.GUI-Windows-x64/EarthTool.WD.GUI-Windows-x64.zip
            artifacts/EarthTool.WD.GUI-Linux-x64/EarthTool.WD.GUI-Linux-x64.tar.gz
            artifacts/EarthTool.PAR.GUI-Windows-x64/EarthTool.PAR.GUI-Windows-x64.zip
            artifacts/EarthTool.PAR.GUI-Linux-x64/EarthTool.PAR.GUI-Linux-x64.tar.gz
            artifacts/EarthTool.TEX.GUI-Windows-x64/EarthTool.TEX.GUI-Windows-x64.zip
            artifacts/EarthTool.TEX.GUI-Linux-x64/EarthTool.TEX.GUI-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
